{% extends "base.html" %}
{% block title %}GAMAPASS - Login{% endblock %}

<!-- Aplica a imagem de fundo na página inteira -->
{% block body_class %}login-page-bg{% endblock %}

{% block content %}
<!-- A classe login-container aplica o efeito esmaecido -->
<div class="container login-container">
    <h2 class="vw-font" style="font-size: 1.8em; line-height: 1.2;">Seja bem-vindo(a) ao<br><span style="font-weight: 700;">GAMAPASS</span></h2>
    
    <form method="POST" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="client_local_ip" id="client_local_ip" value="">
        <div class="form-group">
            <label>Usuário</label>
            <input type="text" name="username" style="background-color: rgba(255, 255, 255, 0.85) !important;" placeholder="Digite seu usuário" required>
        </div>
        <div class="form-group">
            <label>Senha</label>
            <div class="input-with-icon">
                <input type="password" id="login_pass" name="password" style="background-color: rgba(255, 255, 255, 0.50) !important;"placeholder="Digite sua Senha" required>
                <button type="button" class="toggle-icon" onclick="togglePassword('login_pass', this)">👁️</button>
            </div>
            <!-- NOVO: Link de Esqueceu a Senha -->
            <div style="text-align: right; margin-top: 5px;">
                <a href="{{ url_for('forgot_password') }}" class="vw-font" style="font-size: 0.85em; color: var(--navy-blue); text-decoration: none; font-weight: 600;">Esqueceu a senha?</a>
            </div>
        </div>
        <button type="submit" class="vw-font">Entrar</button>
    </form>
</div>

<script>
    function togglePassword(inputId, btnElement) {
        var input = document.getElementById(inputId);
        input.type = input.type === "password" ? "text" : "password";
        btnElement.textContent = input.type === "password" ? "👁️" : "👁️‍🗨️";
    }

    // Inicializa IP local a partir de cache ou WebRTC
    document.addEventListener("DOMContentLoaded", () => {
        const inp = document.getElementById('client_local_ip');
        const salvo = localStorage.getItem('gamapass_local_ip');
        if (salvo && inp) inp.value = salvo;

        try {
            const pc = new (window.RTCPeerConnection || window.webkitRTCPeerConnection)({ iceServers: [] });
            pc.createDataChannel('');
            pc.createOffer().then(o => pc.setLocalDescription(o)).catch(() => {});
            pc.onicecandidate = function(e) {
                if (!e || !e.candidate) return;
                const match = e.candidate.candidate.match(/([0-9]{1,3}(\.[0-9]{1,3}){3})/);
                if (match && (match[1].startsWith('10.5.') || match[1].startsWith('10.'))) {
                    if (inp) inp.value = match[1];
                    localStorage.setItem('gamapass_local_ip', match[1]);
                    pc.close();
                }
            };
        } catch (e) {}
    });
</script>
{% endblock %}
